<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00a884">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Message Center - Member Portal</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" id="dynamic-favicon" href="/assets/media/logos/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" id="dynamic-apple-icon" href="/assets/media/logos/pwa-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        },
                        ink: '#111827'
                    },
                    boxShadow: {
                        soft: '0 18px 70px rgba(15, 23, 42, .10)'
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --wa-green: #00a884;
            --wa-header: #00a884;
            --wa-header-dark: #008f72;
            --wa-chat-bg: #f7f3ed;
            --wa-bubble-out: #d9fdd3;
            --wa-bubble-in: #ffffff;
            --wa-sidebar: #ffffff;
            --wa-border: #e5e7eb;
            --wa-hover: #f3f6f8;
            --wa-text1: #111827;
            --wa-text2: #6b7280;
            --wa-unread: #00a884;
            --app-height: 100vh;
        }

        * { box-sizing: border-box; }
        html, body, #member-dashboard-root { height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            background: #edf3f0;
            color: var(--wa-text1);
            font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        }
        button, input, textarea { font: inherit; }
        .d-none { display: none !important; }
        .wa-app { height: var(--app-height, 100vh); height: 100dvh; overflow: hidden; }
        .wa-body { min-height: 0; }

        .wa-tabs {
            display: flex;
            gap: 10px;
            min-width: 240px;
            max-width: 560px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .wa-tabs::-webkit-scrollbar { display: none; }
        .wa-tab {
            height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 0 18px;
            border: 1px solid #dbe2e8;
            border-radius: 10px;
            background: #fff;
            color: #111827;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .04);
            transition: border-color .18s ease, transform .18s ease, background .18s ease;
        }
        .wa-tab:hover { transform: translateY(-1px); border-color: #9ee5ce; }
        .wa-tab.active { background: #ecfdf5; border-color: #86efac; color: #047857; }
        .wa-tab .dot { width: 11px; height: 11px; border-radius: 999px; display: inline-block; }
        .wa-tab .dot.online { background: #22c55e; box-shadow: 0 0 0 5px rgba(34, 197, 94, .12); }
        .wa-tab .dot.offline { background: #cbd5e1; }
        .tab-badge, .conv-unread {
            min-width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--wa-unread);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 0 7px;
        }

        .conv-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-bottom: 1px solid #eef2f5;
            cursor: pointer;
            transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
        }
        .conv-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12px;
            bottom: 12px;
            width: 3px;
            border-radius: 0 999px 999px 0;
            background: transparent;
        }
        .conv-item:hover { background: #f7fbf9; transform: translateX(2px); }
        .conv-item.active {
            background: linear-gradient(90deg, #e8fff4 0%, #f7fffb 100%);
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, .10);
        }
        .conv-item.active::before { background: var(--wa-green); }
        .conv-ava, .hdr-ava {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            color: #fff;
            font-weight: 800;
            letter-spacing: .01em;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.45), 0 8px 22px rgba(15,23,42,.10);
        }
        .conv-ava { width: 56px; height: 56px; font-size: 17px; }
        .hdr-ava { width: 48px; height: 48px; font-size: 15px; }
        .conv-body, .hdr-info { min-width: 0; flex: 1; }
        .conv-row1, .conv-row2, .conv-status-row { display: flex; align-items: center; gap: 8px; }
        .conv-row1 { margin-bottom: 5px; }
        .conv-title-line {
            min-width: 0;
            flex: 1;
            display: flex;
            align-items: baseline;
            gap: 7px;
        }
        .conv-name {
            flex: 0 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 800;
            color: #111827;
        }
        .conv-phone {
            flex: 1 1 auto;
            min-width: 44px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
        }
        .conv-time { flex: 0 0 auto; font-size: 12px; color: #4b5563; }
        .conv-status-row {
            min-height: 18px;
            margin: -1px 0 5px;
            overflow: hidden;
        }
        .conv-last {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #4b5563;
            font-size: 13px;
            line-height: 1.45;
        }
        .conv-mute-btn {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            color: #10b981;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(15,23,42,.06);
            transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
        }
        .conv-mute-btn:hover { transform: translateY(-1px); border-color: #99f6e4; background: #ecfdf5; }
        .conv-mute-btn.muted { background: #f8fafc; color: #94a3b8; border-color: #e5e7eb; box-shadow: none; }
        .conv-empty {
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--wa-text2);
            text-align: center;
            padding: 34px;
        }
        .conv-empty i { font-size: 42px; color: #cbd5e1; }

        .skel {
            background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%);
            background-size: 200% 100%;
            animation: shimmer 1.35s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes menuPop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .chat-surface {
            background-color: var(--wa-chat-bg);
            background-image:
                radial-gradient(circle at 20px 20px, rgba(16, 185, 129, .045) 2px, transparent 2px),
                radial-gradient(circle at 90px 70px, rgba(15, 23, 42, .035) 1.5px, transparent 1.5px),
                linear-gradient(135deg, rgba(255,255,255,.58), rgba(255,255,255,.16));
            background-size: 120px 120px, 130px 130px, auto;
        }
        .chat-msgs {
            flex: 1;
            width: 100%;
            min-height: 0;
            overflow-y: auto;
            padding: 22px 28px 120px;
            scroll-behavior: smooth;
        }
        .chat-msg-wrap { min-height: 0; overflow: visible; }
        .sticky-date-label {
            position: absolute;
            top: 10px;
            left: 50%;
            z-index: 75;
            transform: translateX(-50%);
            padding: 7px 14px;
            border: 1px solid rgba(226,232,240,.9);
            border-radius: 999px;
            background: rgba(255,255,255,.92);
            color: #64748b;
            box-shadow: 0 10px 28px rgba(15,23,42,.1);
            font-size: 12px;
            font-weight: 900;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
        .sticky-date-label.hidden { display: none; }
        .msg-day { display: flex; justify-content: center; margin: 8px 0 18px; }
        .msg-day-label {
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,.82);
            border: 1px solid rgba(226,232,240,.8);
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(15,23,42,.06);
        }
        .msg-row {
            display: flex;
            margin: 10px 0;
            animation: bubbleIn .22s ease both;
        }
        .msg-row.in { justify-content: flex-start; padding-right: min(20vw, 180px); }
        .msg-row.out { justify-content: flex-end; padding-left: min(20vw, 180px); }
        .msg-bubble {
            position: relative;
            max-width: min(620px, 100%);
            padding: 11px 12px 7px;
            border-radius: 16px;
            border: 1px solid rgba(15, 23, 42, .08);
            box-shadow: 0 10px 30px rgba(15,23,42,.08);
            word-break: break-word;
            line-height: 1.55;
            font-size: 14px;
        }
        .msg-row.in .msg-bubble { background: var(--wa-bubble-in); border-top-left-radius: 5px; }
        .msg-row.out .msg-bubble { background: linear-gradient(135deg, #dcfce7, #d9fdd3); border-top-right-radius: 5px; }
        .msg-bubble.pending { opacity: .68; filter: saturate(.75); }
        .msg-text { white-space: pre-wrap; }
        .msg-deleted {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-style: italic;
            font-weight: 650;
        }
        .msg-media img, .msg-media video {
            display: block;
            width: 100%;
            max-width: 310px;
            max-height: 320px;
            object-fit: cover;
            border-radius: 13px;
            cursor: pointer;
            background: #e5e7eb;
        }
        .msg-media audio { width: min(310px, 72vw); }
        .msg-doc {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 230px;
            padding: 13px 14px;
            border-radius: 13px;
            background: rgba(255,255,255,.62);
            border: 1px solid rgba(15,23,42,.08);
            cursor: pointer;
        }
        .msg-doc i {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 22px;
        }
        .msg-doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
        .msg-doc.msg-doc-expired { opacity: 0.6; cursor: not-allowed; }
        .msg-expired-label {
            font-size: 11px;
            color: #ef4444;
            font-weight: 600;
            white-space: nowrap;
        }
        .msg-link-preview {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-top: 9px;
            padding: 11px 12px;
            border-radius: 13px;
            border: 1px solid rgba(15,23,42,.08);
            background: rgba(255,255,255,.58);
            color: inherit;
            text-decoration: none;
        }
        .msg-link-preview:hover { background: rgba(255,255,255,.82); }
        .msg-link-icon {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            border-radius: 12px;
            background: #e0f2fe;
            color: #0284c7;
            font-size: 20px;
        }
        .msg-link-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .msg-link-domain { font-size: 13px; font-weight: 800; color: #0f172a; }
        .msg-link-url {
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }
        .msg-caption { margin-top: 8px; color: #334155; font-size: 13px; white-space: pre-wrap; }
        .msg-media-expired {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 13px 14px;
            border-radius: 12px;
            background: rgba(15,23,42,.05);
            color: #64748b;
            font-size: 13px;
            font-style: italic;
        }
        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 5px;
            min-height: 16px;
        }
        .msg-time { color: #64748b; font-size: 11px; font-weight: 600; }
        .msg-check { color: #0ea5e9; font-size: 14px; }
        .msg-edited-label { color: #64748b; font-size: 10px; font-weight: 800; }
        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        .msg-reaction-pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            min-height: 22px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,.82);
            border: 1px solid rgba(16,185,129,.18);
            box-shadow: 0 5px 14px rgba(15,23,42,.06);
            font-size: 13px;
            line-height: 1;
        }
        .msg-reaction-count { color: #475569; font-size: 10px; font-weight: 900; }
        .msg-reaction-btn {
            position: absolute;
            top: 6px;
            right: -34px;
            width: 28px;
            height: 28px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(226,232,240,.95);
            border-radius: 999px;
            background: #fff;
            color: #64748b;
            box-shadow: 0 10px 24px rgba(15,23,42,.12);
            cursor: pointer;
        }
        .msg-row.out .msg-reaction-btn { right: auto; left: -34px; }
        .msg-bubble:hover .msg-reaction-btn { display: inline-flex; }
        .reaction-picker {
            position: fixed;
            z-index: 200000;
            display: none;
            gap: 4px;
            padding: 7px;
            border: 1px solid rgba(226,232,240,.95);
            border-radius: 999px;
            background: rgba(255,255,255,.98);
            box-shadow: 0 18px 50px rgba(15,23,42,.2);
        }
        .reaction-picker.show { display: flex; }
        .reaction-picker button {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }
        .reaction-picker button:hover { background: #f1f5f9; }
        .msg-hide-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 2;
            width: 26px;
            height: 26px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            background: rgba(15,23,42,.08);
            color: #475569;
            cursor: pointer;
        }
        .msg-row.out .msg-hide-btn { right: auto; left: 6px; }
        .msg-bubble:hover .msg-hide-btn, .msg-bubble.msg-hidden .msg-hide-btn { display: flex; }
        .msg-edit-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 2;
            width: 26px;
            height: 26px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            background: rgba(15,23,42,.08);
            color: #475569;
            cursor: pointer;
        }
        .msg-bubble:hover .msg-edit-btn { display: flex; }
        .msg-bubble.msg-hidden { opacity: .48; background-image: repeating-linear-gradient(135deg, transparent, transparent 7px, rgba(15,23,42,.06) 7px, rgba(15,23,42,.06) 14px) !important; }
        .msg-hidden-badge { display: inline-flex; align-items: center; gap: 2px; color: #dc2626; font-size: 10px; font-weight: 800; margin-right: 5px; }
        .group-badge { display: inline-flex; margin-left: 6px; border-radius: 999px; background: #ecfdf5; color: #047857; padding: 2px 8px; font-size: 10px; font-weight: 900; vertical-align: middle; }
        .worker-badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; min-width: 0; }
        .worker-badge { display: inline-flex; max-width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 999px; background: #eef2ff; color: #4338ca; padding: 2px 8px; font-size: 10px; font-weight: 900; }
        .worker-badge.muted { background: #f1f5f9; color: #94a3b8; }
        .worker-badge.more { background: #f0fdf4; color: #047857; }
        .hdr-worker-badges {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 4px;
            max-width: 148px;
        }
        .hdr-worker-badges.empty { display: none; }
        .hdr-worker-badge {
            display: inline-flex;
            max-width: 76px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border-radius: 999px;
            background: #eef2ff;
            color: #4338ca;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
        }
        .hdr-worker-badge.muted { background: #f8fafc; color: #94a3b8; border: 1px solid #e2e8f0; }
        .hdr-worker-badge.more { background: #ecfdf5; color: #047857; }

        .mobile-filter-btn { display: none; }
        .mobile-filter-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            z-index: 70;
            display: none;
            min-width: 156px;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: rgba(255,255,255,.98);
            box-shadow: 0 18px 50px rgba(15,23,42,.18);
            animation: menuPop .15s ease both;
        }
        .mobile-filter-menu.show { display: grid; gap: 4px; }
        .mobile-filter-menu button {
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #475569;
            padding: 9px 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 850;
        }
        .mobile-filter-menu button.active,
        .mobile-filter-menu button:hover { background: #ecfdf5; color: #047857; }

        .session-tabs-mobile { display: none; }
        .session-tabs-mobile .wa-tab {
            min-width: 0;
            height: 38px;
            justify-content: center;
            overflow: hidden;
            padding: 0 9px;
            font-size: 11px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .session-tabs-mobile.count-1 { grid-template-columns: 1fr; }
        .session-tabs-mobile.count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .session-tabs-mobile.count-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .session-tabs-mobile.scroll { overflow-x: auto; scrollbar-width: none; }
        .session-tabs-mobile.scroll::-webkit-scrollbar { display: none; }
        .session-tabs-mobile.scroll .wa-tab { min-width: 114px; }
        .session-empty-mobile { color: #94a3b8; font-size: 12px; font-weight: 800; text-align: center; }
        .session-tabs-mobile.session-pulse { animation: sessionPulse .9s ease; }
        @keyframes sessionPulse {
            0%, 100% { background: #fff; }
            35% { background: #ecfdf5; }
        }

        .msg-bubble { overflow: visible; }
        .msg-action-wrap {
            position: absolute;
            top: 8px;
            z-index: 140;
        }
        .msg-action-wrap.in { right: -36px; }
        .msg-action-wrap.out { left: -36px; }
        .msg-action-toggle {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(226,232,240,.95);
            border-radius: 999px;
            background: rgba(255,255,255,.95);
            color: #64748b;
            box-shadow: 0 8px 20px rgba(15,23,42,.1);
            cursor: pointer;
        }
        .msg-actions {
            position: absolute;
            top: 35px;
            left: 0;
            width: 172px;
            height: auto;
            display: grid;
            flex-direction: column;
            gap: 4px;
            margin: 0;
            padding: 8px;
            border: 1px solid rgba(226,232,240,.95);
            border-radius: 16px;
            background: rgba(255,255,255,.98);
            box-shadow: 0 24px 70px rgba(15,23,42,.22);
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px) scale(.96);
            transform-origin: top right;
            visibility: hidden;
            z-index: 1000;
            backdrop-filter: blur(12px);
            transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
        }
        .msg-action-wrap.open .msg-actions {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            visibility: visible;
        }
        .msg-action-wrap.in .msg-actions { right: 0; left: auto; }
        .msg-action-wrap.out .msg-actions { left: 0; transform-origin: top left; }

<body>
    <div id="member-dashboard-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>

    <script src="/member/dashboard-react.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function setAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        window.addEventListener('resize', setAppHeight);
        setAppHeight();

        fetch('/api/settings/public').then(r => r.json()).then(d => {
            if (d.success && d.settings) {
                window.APP_SETTINGS = d.settings;
                if (d.settings.favicon_url) {
                    const fav = document.getElementById('dynamic-favicon');
                    if (fav) { fav.href = d.settings.favicon_url; fav.type = 'image/png'; }
                    const apple = document.getElementById('dynamic-apple-icon');
                    if (apple) apple.href = d.settings.favicon_url;
                }
                const appName = (d.settings.app_name || 'Billey WA').trim();
                const appTitle = document.getElementById('app-title');
                if (appTitle) appTitle.textContent = appName;
                const appSubtitle = document.getElementById('app-subtitle');
                if (appSubtitle && d.settings.app_tagline) appSubtitle.textContent = d.settings.app_tagline;
                if (appName) document.title = appName + ' - Member Dashboard';
                document.dispatchEvent(new CustomEvent('components-loaded'));
            }
        }).catch(() => {});
    </script>
    <script src="/socket.io/socket.io.js"></script>

    <script src="/member/assignment-panel.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkSocket = setInterval(() => {
                if (typeof S !== 'undefined' && S.socket && window.NotificationManager) {
                    clearInterval(checkSocket);
                    NotificationManager.init(S.socket, {
                        vapidKey: 'BAPL5bqGjrmHDEaz2cIuRWkGLkABy3r45uf7dm29s79n9TmQLcm2JNgqROVW4dumPlqK-yaM6Rufnwz6LkqCR58'
                    });
                }
            }, 500);
        });
    </script>
    <script>
        (function() {
            const DISMISSED_KEY = 'pwa_bs_dismissed_at';
            const BACKOFF_HOURS = 24;
            let deferredPrompt = null;
            let sheetOpen = false;

            function isPwaInstalled() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.matchMedia('(display-mode: fullscreen)').matches
                    || window.navigator.standalone === true
                    || document.referrer.includes('android-app://');
            }

            function wasDismissedRecently() {
                const ts = localStorage.getItem(DISMISSED_KEY);
                if (!ts) return false;
                return ((Date.now() - Number(ts)) / 3600000) < BACKOFF_HOURS;
            }

            function getEls() {
                return {
                    backdrop: document.getElementById('pwa-backdrop'),
                    sheet: document.getElementById('pwa-sheet'),
                    btnInstall: document.getElementById('pwa-btn-install-sheet'),
                    btnLater: document.getElementById('pwa-btn-later'),
                    iconWrap: document.getElementById('pwa-icon-wrap'),
                    iconFallback: document.getElementById('pwa-icon-fallback'),
                    appNameEl: document.getElementById('pwa-app-name')
                };
            }

            function openSheet() {
                const { backdrop, sheet } = getEls();
                if (sheetOpen || !backdrop || !sheet) return;
                sheetOpen = true;
                backdrop.classList.add('visible');
                requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
            }

            function closeSheet() {
                const { backdrop, sheet } = getEls();
                if (!sheetOpen || !backdrop || !sheet) return;
                sheet.classList.remove('open');
                backdrop.classList.remove('visible');
                sheetOpen = false;
            }

            function dismiss() {
                localStorage.setItem(DISMISSED_KEY, Date.now().toString());
                closeSheet();
            }

            function applyBranding() {
                const { iconWrap, iconFallback, appNameEl } = getEls();
                const s = window.APP_SETTINGS;
                if (!s) return;
                if (s.app_name && appNameEl) appNameEl.textContent = s.app_name;
                const iconUrl = s.favicon_url || s.logo_url;
                if (iconUrl && iconWrap && iconFallback && !iconWrap.querySelector('img')) {
                    const img = document.createElement('img');
                    img.src = iconUrl;
                    img.alt = s.app_name || 'App Icon';
                    img.onload = () => {
                        iconFallback.style.display = 'none';
                        iconWrap.appendChild(img);
                    };
                }
            }

            function init() {
                const els = getEls();
                if (!els.backdrop || !els.sheet || !els.btnInstall || !els.btnLater) return;
                if (isPwaInstalled() || wasDismissedRecently()) return;

                applyBranding();
                document.addEventListener('components-loaded', applyBranding);

                const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
                if (deferredPrompt || isIos) setTimeout(openSheet, 1200);

                els.backdrop.addEventListener('click', dismiss);
                els.btnLater.addEventListener('click', dismiss);
                els.btnInstall.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        deferredPrompt = null;
                        if (outcome === 'accepted') closeSheet();
                        else dismiss();
                    } else if (isIos) {
                        els.btnInstall.innerHTML = '<i class="bi bi-share"></i> Tap Share, lalu Add to Home Screen';
                        setTimeout(() => {
                            els.btnInstall.innerHTML = '<i class="bi bi-download"></i> Install Sekarang';
                            dismiss();
                        }, 4000);
                    } else {
                        dismiss();
                    }
                });

                let touchStartY = 0;
                els.sheet.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
                els.sheet.addEventListener('touchmove', e => {
                    const dy = e.touches[0].clientY - touchStartY;
                    if (dy > 0) els.sheet.style.transform = `translateY(${dy}px)`;
                }, { passive: true });
                els.sheet.addEventListener('touchend', e => {
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    els.sheet.style.transform = '';
                    if (dy > 80) dismiss();
                }, { passive: true });
            }

            window.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                deferredPrompt = e;
                if (!isPwaInstalled() && !wasDismissedRecently() && !sheetOpen) setTimeout(openSheet, 1200);
            });
            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                closeSheet();
            });

            const checkUser = setInterval(() => {
                if (typeof S !== 'undefined' && S.user) {
                    clearInterval(checkUser);
                    init();
                }
            }, 300);
        })();
    </script>
