<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00a884">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Message Center - Member Portal</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" id="dynamic-favicon" href="/assets/media/logos/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" id="dynamic-apple-icon" href="/assets/media/logos/pwa-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        },
                        ink: '#111827'
                    },
                    boxShadow: {
                        soft: '0 18px 70px rgba(15, 23, 42, .10)'
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --wa-green: #00a884;
            --wa-header: #00a884;
            --wa-header-dark: #008f72;
            --wa-chat-bg: #f7f3ed;
            --wa-bubble-out: #d9fdd3;
            --wa-bubble-in: #ffffff;
            --wa-sidebar: #ffffff;
            --wa-border: #e5e7eb;
            --wa-hover: #f3f6f8;
            --wa-text1: #111827;
            --wa-text2: #6b7280;
            --wa-unread: #00a884;
            --app-height: 100vh;
        }

        * { box-sizing: border-box; }
        html, body, #member-dashboard-root { height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            background: #edf3f0;
            color: var(--wa-text1);
            font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        }
        button, input, textarea { font: inherit; }
        .d-none { display: none !important; }
        .wa-app { height: var(--app-height, 100vh); height: 100dvh; overflow: hidden; }
        .wa-body { min-height: 0; }

        .wa-tabs {
            display: flex;
            gap: 10px;
            min-width: 240px;
            max-width: 560px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .wa-tabs::-webkit-scrollbar { display: none; }
        .wa-tab {
            height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 0 18px;
            border: 1px solid #dbe2e8;
            border-radius: 10px;
            background: #fff;
            color: #111827;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .04);
            transition: border-color .18s ease, transform .18s ease, background .18s ease;
        }
        .wa-tab:hover { transform: translateY(-1px); border-color: #9ee5ce; }
        .wa-tab.active { background: #ecfdf5; border-color: #86efac; color: #047857; }
        .wa-tab .dot { width: 11px; height: 11px; border-radius: 999px; display: inline-block; }
        .wa-tab .dot.online { background: #22c55e; box-shadow: 0 0 0 5px rgba(34, 197, 94, .12); }
        .wa-tab .dot.offline { background: #cbd5e1; }
        .tab-badge, .conv-unread {
            min-width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--wa-unread);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            padding: 0 7px;
        }

        .conv-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-bottom: 1px solid #eef2f5;
            cursor: pointer;
            transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
        }
        .conv-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12px;
            bottom: 12px;
            width: 3px;
            border-radius: 0 999px 999px 0;
            background: transparent;
        }
        .conv-item:hover { background: #f7fbf9; transform: translateX(2px); }
        .conv-item.active {
            background: linear-gradient(90deg, #e8fff4 0%, #f7fffb 100%);
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, .10);
        }
        .conv-item.active::before { background: var(--wa-green); }
        .conv-ava, .hdr-ava {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            color: #fff;
            font-weight: 800;
            letter-spacing: .01em;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.45), 0 8px 22px rgba(15,23,42,.10);
        }
        .conv-ava { width: 56px; height: 56px; font-size: 17px; }
        .hdr-ava { width: 48px; height: 48px; font-size: 15px; }
        .conv-body, .hdr-info { min-width: 0; flex: 1; }
        .conv-row1, .conv-row2 { display: flex; align-items: center; gap: 8px; }
        .conv-row1 { margin-bottom: 5px; }
        .conv-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 800;
            color: #111827;
        }
        .conv-time { flex: 0 0 auto; font-size: 12px; color: #4b5563; }
        .conv-last {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #4b5563;
            font-size: 13px;
            line-height: 1.45;
        }
        .conv-empty {
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--wa-text2);
            text-align: center;
            padding: 34px;
        }
        .conv-empty i { font-size: 42px; color: #cbd5e1; }

        .skel {
            background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%);
            background-size: 200% 100%;
            animation: shimmer 1.35s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes menuPop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .chat-surface {
            background-color: var(--wa-chat-bg);
            background-image:
                radial-gradient(circle at 20px 20px, rgba(16, 185, 129, .045) 2px, transparent 2px),
                radial-gradient(circle at 90px 70px, rgba(15, 23, 42, .035) 1.5px, transparent 1.5px),
                linear-gradient(135deg, rgba(255,255,255,.58), rgba(255,255,255,.16));
            background-size: 120px 120px, 130px 130px, auto;
        }
        .chat-msgs {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 22px 28px;
            scroll-behavior: smooth;
        }
        .msg-day { display: flex; justify-content: center; margin: 8px 0 18px; }
        .msg-day-label {
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,.82);
            border: 1px solid rgba(226,232,240,.8);
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(15,23,42,.06);
        }
        .msg-row {
            display: flex;
            margin: 10px 0;
            animation: bubbleIn .22s ease both;
        }
        .msg-row.in { justify-content: flex-start; padding-right: min(20vw, 180px); }
        .msg-row.out { justify-content: flex-end; padding-left: min(20vw, 180px); }
        .msg-bubble {
            position: relative;
            max-width: min(620px, 100%);
            padding: 11px 12px 7px;
            border-radius: 16px;
            border: 1px solid rgba(15, 23, 42, .08);
            box-shadow: 0 10px 30px rgba(15,23,42,.08);
            word-break: break-word;
            line-height: 1.55;
            font-size: 14px;
        }
        .msg-row.in .msg-bubble { background: var(--wa-bubble-in); border-top-left-radius: 5px; }
        .msg-row.out .msg-bubble { background: linear-gradient(135deg, #dcfce7, #d9fdd3); border-top-right-radius: 5px; }
        .msg-bubble.pending { opacity: .68; filter: saturate(.75); }
        .msg-text { white-space: pre-wrap; }
        .msg-media img, .msg-media video {
            display: block;
            width: 100%;
            max-width: 310px;
            max-height: 320px;
            object-fit: cover;
            border-radius: 13px;
            cursor: pointer;
            background: #e5e7eb;
        }
        .msg-media audio { width: min(310px, 72vw); }
        .msg-doc {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 230px;
            padding: 13px 14px;
            border-radius: 13px;
            background: rgba(255,255,255,.62);
            border: 1px solid rgba(15,23,42,.08);
            cursor: pointer;
        }
        .msg-doc i {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 22px;
        }
        .msg-doc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
        .msg-link-preview {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-top: 9px;
            padding: 11px 12px;
            border-radius: 13px;
            border: 1px solid rgba(15,23,42,.08);
            background: rgba(255,255,255,.58);
            color: inherit;
            text-decoration: none;
        }
        .msg-link-preview:hover { background: rgba(255,255,255,.82); }
        .msg-link-icon {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            border-radius: 12px;
            background: #e0f2fe;
            color: #0284c7;
            font-size: 20px;
        }
        .msg-link-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .msg-link-domain { font-size: 13px; font-weight: 800; color: #0f172a; }
        .msg-link-url {
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }
        .msg-caption { margin-top: 8px; color: #334155; font-size: 13px; white-space: pre-wrap; }
        .msg-media-expired {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 13px 14px;
            border-radius: 12px;
            background: rgba(15,23,42,.05);
            color: #64748b;
            font-size: 13px;
            font-style: italic;
        }
        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            margin-top: 5px;
            min-height: 16px;
        }
        .msg-time { color: #64748b; font-size: 11px; font-weight: 600; }
        .msg-check { color: #0ea5e9; font-size: 14px; }
        .msg-hide-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 2;
            width: 26px;
            height: 26px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            background: rgba(15,23,42,.08);
            color: #475569;
            cursor: pointer;
        }
        .msg-row.out .msg-hide-btn { right: auto; left: 6px; }
        .msg-bubble:hover .msg-hide-btn, .msg-bubble.msg-hidden .msg-hide-btn { display: flex; }
        .msg-bubble.msg-hidden { opacity: .48; background-image: repeating-linear-gradient(135deg, transparent, transparent 7px, rgba(15,23,42,.06) 7px, rgba(15,23,42,.06) 14px) !important; }
        .msg-hidden-badge { display: inline-flex; align-items: center; gap: 2px; color: #dc2626; font-size: 10px; font-weight: 800; margin-right: 5px; }

        .attachment-menu {
            position: absolute;
            left: 18px;
            bottom: 76px;
            width: 184px;
            display: none;
            padding: 9px;
            border-radius: 16px;
            background: rgba(255,255,255,.96);
            border: 1px solid rgba(226,232,240,.95);
            box-shadow: 0 22px 60px rgba(15,23,42,.18);
            z-index: 60;
            animation: menuPop .16s ease both;
        }
        .attachment-menu.show { display: block; }
        .attachment-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 11px;
            border: 0;
            background: transparent;
            padding: 10px;
            border-radius: 12px;
            color: #111827;
            cursor: pointer;
            text-align: left;
            font-weight: 700;
        }
        .attachment-option:hover { background: #f8fafc; }
        .attachment-option i {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: #fff;
        }
        .attachment-option.image i { background: #22c55e; }
        .attachment-option.video i { background: #6366f1; }
        .attachment-option.document i { background: #0ea5e9; }
        .attachment-option.audio i { background: #f97316; }

        .note-icon, .report-icon, .note-icon-hdr, .report-icon-hdr {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
        }
        .note-icon, .report-icon { width: 22px; height: 22px; margin-left: 5px; border-radius: 7px; font-size: 11px; }
        .note-icon-hdr, .report-icon-hdr { width: 36px; height: 36px; border-radius: 12px; font-size: 14px; }
        .note-icon:hover, .report-icon:hover, .note-icon-hdr:hover, .report-icon-hdr:hover { transform: scale(1.08); }
        .note-low, .note-icon.note-low { background: #ecfdf5; color: #059669; }
        .note-medium, .note-icon.note-medium { background: #fff7ed; color: #ea580c; }
        .note-critical, .note-icon.note-critical { background: #fef2f2; color: #dc2626; }
        .report-icon, .report-icon-hdr { background: #eff6ff; color: #2563eb; }

        .assignment-banner {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 18px;
            background: #fffbeb;
            border-bottom: 1px solid #fde68a;
            color: #92400e;
            font-size: 12px;
            font-weight: 700;
        }

        .media-overlay, .note-modal-overlay, .report-modal-overlay, .tpl-overlay, .img-viewer {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(15,23,42,.58);
            backdrop-filter: blur(8px);
        }
        .media-overlay.show, .note-modal-overlay.show, .report-modal-overlay.show, .tpl-overlay.show, .img-viewer.show { display: flex; }
        .media-box, .note-modal, .report-modal, .tpl-panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            box-shadow: 0 28px 90px rgba(15,23,42,.28);
            overflow: hidden;
        }
        .media-box { width: min(440px, 92vw); padding: 20px; }
        .media-box-hdr, .note-modal-hdr, .report-modal-hdr, .tpl-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .media-box-hdr { margin-bottom: 14px; }
        .media-box-hdr h6 { margin: 0; font-size: 16px; font-weight: 800; }
        .media-close-btn, .note-modal-close, .report-modal-close, .tpl-hdr-close {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
        }
        .media-preview {
            min-height: 150px;
            max-height: 300px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border-radius: 16px;
            background: #f8fafc;
            color: #64748b;
        }
        .media-preview img, .media-preview video { max-width: 100%; max-height: 300px; border-radius: 14px; }
        .doc-icon { font-size: 44px; color: #2563eb; }
        .media-caption-inp, .tpl-search input, .report-modal-body input, .report-modal-body textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            padding: 11px 13px;
            outline: none;
        }
        .media-caption-inp { margin-bottom: 12px; }
        .media-caption-inp:focus, .tpl-search input:focus, .report-modal-body textarea:focus { border-color: #86efac; box-shadow: 0 0 0 4px rgba(34,197,94,.12); background: #fff; }
        .media-send-btn, .report-send-btn {
            width: 100%;
            border: 0;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 14px;
            background: var(--wa-green);
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }
        .img-viewer { z-index: 300; background: rgba(2,6,23,.92); cursor: zoom-out; }
        .img-viewer img { max-width: 92vw; max-height: 90vh; object-fit: contain; border-radius: 14px; }
        .img-viewer-close { position: fixed; top: 18px; right: 18px; z-index: 2; width: 42px; height: 42px; border: 0; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; }

        .note-modal, .report-modal { width: min(430px, 92vw); }
        .note-modal-hdr, .report-modal-hdr { padding: 16px 18px; border-bottom: 1px solid #eef2f7; }
        .note-modal-hdr-left, .report-modal-hdr-left { display: flex; align-items: center; gap: 10px; font-weight: 800; }
        .note-modal-body, .report-modal-body { padding: 18px; }
        .note-priority-badge { display: inline-flex; padding: 5px 11px; border-radius: 999px; background: #ecfdf5; color: #047857; font-size: 12px; font-weight: 800; margin-bottom: 12px; }
        .note-content { color: #334155; line-height: 1.6; white-space: pre-wrap; }
        .report-modal-body label { display: block; margin: 12px 0 6px; color: #475569; font-size: 12px; font-weight: 800; }
        .report-modal-body textarea { min-height: 100px; resize: vertical; margin-bottom: 14px; }

        .tpl-overlay { z-index: 250; }
        .tpl-panel { width: min(540px, 92vw); max-height: 72vh; display: flex; flex-direction: column; }
        .tpl-hdr { padding: 16px 18px; border-bottom: 1px solid #eef2f7; font-weight: 800; }
        .tpl-hdr i { color: var(--wa-green); }
        .tpl-search { padding: 14px 18px; border-bottom: 1px solid #eef2f7; }
        .tpl-list { overflow-y: auto; }
        .tpl-item { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .tpl-item:hover { background: #f0fdf4; }
        .tpl-code { display: inline-flex; border-radius: 999px; background: #ecfdf5; color: #047857; padding: 3px 10px; font-size: 12px; font-weight: 800; }
        .tpl-code::before { content: '#'; }
        .tpl-title { margin-top: 6px; font-weight: 800; }
        .tpl-preview { margin-top: 4px; color: #64748b; font-size: 13px; line-height: 1.5; }
        .tpl-media-badge { margin-left: 7px; display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #eff6ff; color: #2563eb; padding: 3px 8px; font-size: 11px; font-weight: 800; }
        .tpl-empty { padding: 44px 20px; text-align: center; color: #64748b; }
        .tpl-empty i { display: block; margin-bottom: 10px; color: #cbd5e1; font-size: 34px; }

        .pwa-backdrop {
            position: fixed;
            inset: 0;
            z-index: 90000;
            background: rgba(0,0,0,0);
            pointer-events: none;
            transition: background .35s ease;
        }
        .pwa-backdrop.visible { background: rgba(15,23,42,.45); pointer-events: auto; }
        .pwa-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 90001;
            max-width: 520px;
            margin: 0 auto;
            padding-bottom: env(safe-area-inset-bottom, 16px);
            border-radius: 22px 22px 0 0;
            background: #fff;
            box-shadow: 0 -20px 70px rgba(15,23,42,.24);
            transform: translateY(110%);
            transition: transform .42s cubic-bezier(.32,.72,0,1);
        }
        .pwa-sheet.open { transform: translateY(0); }
        .pwa-handle { width: 42px; height: 4px; border-radius: 999px; background: #dbe3ea; margin: 10px auto 0; }
        .pwa-body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 28px 24px; text-align: center; }
        .pwa-icon-wrap { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 18px; background: #ecfdf5; box-shadow: 0 8px 24px rgba(15,23,42,.12); }
        .pwa-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .pwa-icon-fallback { font-size: 34px; color: var(--wa-green); }
        .pwa-title { margin: 0; font-weight: 800; }
        .pwa-desc { margin: 0; max-width: 320px; color: #64748b; font-size: 13px; line-height: 1.55; }
        .pwa-actions { display: flex; gap: 10px; width: 100%; }
        .pwa-btn-later, .pwa-btn-install { border: 0; border-radius: 13px; padding: 13px 16px; font-weight: 800; cursor: pointer; }
        .pwa-btn-later { background: #f1f5f9; color: #475569; }
        .pwa-btn-install { flex: 1; background: var(--wa-green); color: #fff; }
        .pwa-hint { color: #94a3b8; font-size: 12px; }

        @media (max-width: 1180px) {
            .contact-panel { display: none; }
        }
        @media (max-width: 820px) {
            .desktop-only { display: none !important; }
            .wa-body { position: relative; }
            .wa-conv { width: 100% !important; }
            .wa-conv.mob-hide { display: none !important; }
            .wa-chat { width: 100% !important; }
            .wa-chat.mob-hide { display: none !important; }
            .btn-back { display: inline-flex !important; }
            .chat-msgs { padding: 16px 14px; }
            .msg-row.in { padding-right: 22px; }
            .msg-row.out { padding-left: 22px; }
            .attachment-menu { left: 12px; bottom: 72px; }
        }
    </style>
</head>
<body>
    <div id="member-dashboard-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="/member/dashboard-react.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function setAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        window.addEventListener('resize', setAppHeight);
        setAppHeight();

        fetch('/api/settings/public').then(r => r.json()).then(d => {
            if (d.success && d.settings) {
                window.APP_SETTINGS = d.settings;
                if (d.settings.favicon_url) {
                    const fav = document.getElementById('dynamic-favicon');
                    if (fav) { fav.href = d.settings.favicon_url; fav.type = 'image/png'; }
                    const apple = document.getElementById('dynamic-apple-icon');
                    if (apple) apple.href = d.settings.favicon_url;
                }
                if (d.settings.app_name) document.title = d.settings.app_name + ' - Message Center';
                document.dispatchEvent(new CustomEvent('components-loaded'));
            }
        }).catch(() => {});
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/member/chat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkSocket = setInterval(() => {
                if (typeof S !== 'undefined' && S.socket && window.NotificationManager) {
                    clearInterval(checkSocket);
                    NotificationManager.init(S.socket, {
                        vapidKey: 'BAPL5bqGjrmHDEaz2cIuRWkGLkABy3r45uf7dm29s79n9TmQLcm2JNgqROVW4dumPlqK-yaM6Rufnwz6LkqCR58'
                    });
                }
            }, 500);
        });
    </script>
    <script>
        (function() {
            const DISMISSED_KEY = 'pwa_bs_dismissed_at';
            const BACKOFF_HOURS = 24;
            let deferredPrompt = null;
            let sheetOpen = false;

            function isPwaInstalled() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.matchMedia('(display-mode: fullscreen)').matches
                    || window.navigator.standalone === true
                    || document.referrer.includes('android-app://');
            }

            function wasDismissedRecently() {
                const ts = localStorage.getItem(DISMISSED_KEY);
                if (!ts) return false;
                return ((Date.now() - Number(ts)) / 3600000) < BACKOFF_HOURS;
            }

            function getEls() {
                return {
                    backdrop: document.getElementById('pwa-backdrop'),
                    sheet: document.getElementById('pwa-sheet'),
                    btnInstall: document.getElementById('pwa-btn-install-sheet'),
                    btnLater: document.getElementById('pwa-btn-later'),
                    iconWrap: document.getElementById('pwa-icon-wrap'),
                    iconFallback: document.getElementById('pwa-icon-fallback'),
                    appNameEl: document.getElementById('pwa-app-name')
                };
            }

            function openSheet() {
                const { backdrop, sheet } = getEls();
                if (sheetOpen || !backdrop || !sheet) return;
                sheetOpen = true;
                backdrop.classList.add('visible');
                requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('open')));
            }

            function closeSheet() {
                const { backdrop, sheet } = getEls();
                if (!sheetOpen || !backdrop || !sheet) return;
                sheet.classList.remove('open');
                backdrop.classList.remove('visible');
                sheetOpen = false;
            }

            function dismiss() {
                localStorage.setItem(DISMISSED_KEY, Date.now().toString());
                closeSheet();
            }

            function applyBranding() {
                const { iconWrap, iconFallback, appNameEl } = getEls();
                const s = window.APP_SETTINGS;
                if (!s) return;
                if (s.app_name && appNameEl) appNameEl.textContent = s.app_name;
                const iconUrl = s.favicon_url || s.logo_url;
                if (iconUrl && iconWrap && iconFallback && !iconWrap.querySelector('img')) {
                    const img = document.createElement('img');
                    img.src = iconUrl;
                    img.alt = s.app_name || 'App Icon';
                    img.onload = () => {
                        iconFallback.style.display = 'none';
                        iconWrap.appendChild(img);
                    };
                }
            }

            function init() {
                const els = getEls();
                if (!els.backdrop || !els.sheet || !els.btnInstall || !els.btnLater) return;
                if (isPwaInstalled() || wasDismissedRecently()) return;

                applyBranding();
                document.addEventListener('components-loaded', applyBranding);

                const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
                if (deferredPrompt || isIos) setTimeout(openSheet, 1200);

                els.backdrop.addEventListener('click', dismiss);
                els.btnLater.addEventListener('click', dismiss);
                els.btnInstall.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        deferredPrompt = null;
                        if (outcome === 'accepted') closeSheet();
                        else dismiss();
                    } else if (isIos) {
                        els.btnInstall.innerHTML = '<i class="bi bi-share"></i> Tap Share, lalu Add to Home Screen';
                        setTimeout(() => {
                            els.btnInstall.innerHTML = '<i class="bi bi-download"></i> Install Sekarang';
                            dismiss();
                        }, 4000);
                    } else {
                        dismiss();
                    }
                });

                let touchStartY = 0;
                els.sheet.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
                els.sheet.addEventListener('touchmove', e => {
                    const dy = e.touches[0].clientY - touchStartY;
                    if (dy > 0) els.sheet.style.transform = `translateY(${dy}px)`;
                }, { passive: true });
                els.sheet.addEventListener('touchend', e => {
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    els.sheet.style.transform = '';
                    if (dy > 80) dismiss();
                }, { passive: true });
            }

            window.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                deferredPrompt = e;
                if (!isPwaInstalled() && !wasDismissedRecently() && !sheetOpen) setTimeout(openSheet, 1200);
            });
            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                closeSheet();
            });

            const checkUser = setInterval(() => {
                if (typeof S !== 'undefined' && S.user) {
                    clearInterval(checkUser);
                    init();
                }
            }, 300);
        })();
    </script>
</body>
</html>
