<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WhatsApp Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green: #25D366;
            --green-dark: #128C7E;
            --green-glow: rgba(37, 211, 102, .18);
            --bg: #f0f4f8;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1a202c;
            --muted: #718096;
            --danger: #e53e3e;
            --radius: 14px;
            --shadow: 0 20px 60px rgba(0, 0, 0, .10);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: var(--card);
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            padding: 40px 36px 36px;
            animation: slideUp .35s cubic-bezier(.16, 1, .3, 1) both;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
        .logo-icon {
            width: 44px; height: 44px; background: linear-gradient(135deg, var(--green), var(--green-dark));
            border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px;
            box-shadow: 0 4px 14px var(--green-glow);
        }
        .logo-text { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
        .logo-text span { color: var(--green); }
        .heading { text-align: center; margin-bottom: 28px; }
        .heading h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .heading p { font-size: 14px; color: var(--muted); }
        .alert {
            display: none; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--radius);
            font-size: 13.5px; font-weight: 500; margin-bottom: 20px; animation: fadeIn .2s ease;
        }
        .alert.show { display: flex; }
        .alert-danger { background: #fff5f5; color: var(--danger); border: 1px solid #fed7d7; }
        .alert-success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
        .alert i { flex-shrink: 0; font-size: 16px; margin-top: 1px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
        .input-wrap { position: relative; }
        .input-wrap .ico {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #a0aec0; font-size: 16px;
            pointer-events: none; transition: color .2s;
        }
        .input-wrap input {
            width: 100%; height: 48px; border: 1.5px solid var(--border); border-radius: var(--radius);
            padding: 0 44px 0 42px; font-size: 14.5px; font-family: inherit; color: var(--text);
            background: #fafafa; outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .input-wrap input:focus { border-color: var(--green); background: #fff; box-shadow: 0 0 0 3px var(--green-glow); }
        .input-wrap input:focus + .ico { color: var(--green); }
        .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #a0aec0; font-size: 16px;
            cursor: pointer; border: none; background: none; padding: 0; transition: color .2s;
        }
        .toggle-pw:hover { color: var(--green); }
        .row-check { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 22px; font-size: 13px; }
        .check-label { display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; }
        .check-label input[type=checkbox] { accent-color: var(--green); width: 15px; height: 15px; cursor: pointer; }
        .btn-login {
            width: 100%; height: 50px; background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
            color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600;
            font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform .18s, box-shadow .18s, opacity .18s; box-shadow: 0 4px 14px var(--green-glow);
        }
        .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px var(--green-glow); }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled { opacity: .65; cursor: not-allowed; }
        .spinner {
            width: 18px; height: 18px; border: 2.5px solid rgba(255, 255, 255, .4); border-top-color: #fff;
            border-radius: 50%; animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-note { text-align: center; margin-top: 22px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; }
        @media (max-width: 440px) { .card { padding: 32px 22px 26px; border-radius: 20px; } .heading h1 { font-size: 20px; } }
    </style>
</head>
<body>
<div class="card">
    <div class="logo-wrap">
        <div class="logo-icon"><i class="bi bi-whatsapp"></i></div>
        <div class="logo-text">Billey <span>WA</span></div>
    </div>
    <div class="heading">
        <h1>Selamat Datang 👋</h1>
        <p>Masuk ke akun Anda untuk melanjutkan</p>
    </div>
    <div id="alert-container" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="alert-message"></span>
    </div>
    <form id="login-form" novalidate>
        <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
                <input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required>
                <i class="bi bi-envelope ico"></i>
            </div>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
                <i class="bi bi-lock ico"></i>
                <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Tampilkan password"><i class="bi bi-eye" id="toggle-pw-icon"></i></button>
            </div>
        </div>
        <div class="row-check">
            <label class="check-label" for="remember"><input type="checkbox" id="remember" checked>Ingat saya</label>
        </div>
        <button type="submit" class="btn-login" id="btn-login"><span id="btn-text">Masuk</span></button>
    </form>
    <div class="footer-note"><i class="bi bi-shield-lock"></i>Koneksi aman &amp; terenkripsi</div>
</div>
<script>
    document.getElementById('toggle-pw').addEventListener('click', function() {
        const input = document.getElementById('password');
        const icon = document.getElementById('toggle-pw-icon');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        icon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
    function showAlert(msg, type = 'danger') {
        const box = document.getElementById('alert-container');
        const txt = document.getElementById('alert-message');
        box.className = 'alert alert-' + type + ' show';
        box.querySelector('i').className = type === 'success' ? 'bi bi-check-circle-fill' : 'bi bi-exclamation-circle-fill';
        txt.textContent = msg;
    }
    function hideAlert() { document.getElementById('alert-container').classList.remove('show'); }
    function setLoading(on) {
        const btn = document.getElementById('btn-login');
        btn.disabled = on;
        if (on) btn.innerHTML = '<span class="spinner"></span><span>Memproses...</span>';
        else btn.innerHTML = '<span id="btn-text">Masuk</span>';
    }
    (async function() {
        try {
            const r = await fetch('/api/auth/me');
            if (r.ok) {
                const d = await r.json();
                if (d.success && d.user) window.location.href = d.user.role === 'adminwa' ? '/index.html' : '/member/dashboard.html';
            }
        } catch {}
    })();
    const err = new URLSearchParams(window.location.search).get('error');
    if (err) showAlert(decodeURIComponent(err));
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) {
            showAlert('Email dan password wajib diisi');
            return;
        }
        setLoading(true);
        try {
            const r = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const d = await r.json();
            if (d.success) {
                showAlert('Login berhasil! Mengalihkan...', 'success');
                localStorage.setItem('wa_user', JSON.stringify(d.user));
                setTimeout(() => {
                    window.location.href = d.user.role === 'adminwa' ? '/index.html' : '/member/dashboard.html';
                }, 700);
            } else {
                showAlert(d.error || 'Email atau password salah');
            }
        } catch {
            showAlert('Terjadi kesalahan. Silakan coba lagi.');
        } finally {
            setLoading(false);
        }
    });
    document.getElementById('email').focus();
</script>
</body>
</html>
