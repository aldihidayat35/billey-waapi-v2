<!--begin::Change Password Modal-->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Ubah Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label class="form-label required">Password Lama</label>
                        <input type="password" class="form-control" name="currentPassword" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">Password Baru</label>
                        <input type="password" class="form-control" name="newPassword" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">Konfirmasi Password Baru</label>
                        <input type="password" class="form-control" name="confirmPassword" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-primary" id="btnSavePassword">Simpan</button>
            </div>
        </div>
    </div>
</div>
<!--end::Change Password Modal-->

<!-- ── Header Dynamic Branding ─────────────────────────────────
     Updates the mobile logo and app name dynamically using
     settings from /api/settings/public.
     Uses same pattern as sidebar (data-is-default CSS filter).
──────────────────────────────────────────────────────────────── -->
<style>
/* Default SVG mobile logo: invert to match theme if needed */
#header-logo-mobile[data-is-default="true"] {
    /* Keep default styles — no forced inversion on light header */
    opacity: 0.85;
}
#header-logo-mobile:not([data-is-default]) {
    filter: none;
    opacity: 1;
}
</style>
<script>
(function applyHeaderBranding() {
    function applySettings(s) {
        if (!s) return;

        const logoMobile  = document.getElementById('header-logo-mobile');
        const appNameMob  = document.getElementById('header-app-name-mobile');

        // ── Mobile logo ───────────────────────────────────────────
        const customSmall = s.logo_small_url || s.logo_url;
        if (logoMobile && customSmall) {
            logoMobile.src = customSmall;
            logoMobile.removeAttribute('data-is-default');
        }

        // ── Mobile app name ───────────────────────────────────────
        if (appNameMob && s.app_name) {
            appNameMob.textContent = s.app_name;
        }

        // ── Desktop header title (data-app-name spans) ────────────
        document.querySelectorAll('[data-app-name]').forEach(el => {
            if (el.id !== 'sidebar-app-name') { // sidebar handles itself
                el.textContent = s.app_name || el.textContent;
            }
        });

        // ── Store globally ────────────────────────────────────────
        window.APP_SETTINGS = Object.assign(window.APP_SETTINGS || {}, s);
    }

    // Reuse already-fetched settings, or fetch fresh
    if (window.APP_SETTINGS && window.APP_SETTINGS.app_name) {
        applySettings(window.APP_SETTINGS);
    } else {
        fetch('/api/settings/public')
            .then(r => r.ok ? r.json() : null)
            .then(data => { if (data && data.success) applySettings(data.settings); })
            .catch(() => {});
    }
})();
</script>
