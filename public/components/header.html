<!--begin::Change Password Modal-->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Ubah Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label class="form-label required">Password Lama</label>
                        <input type="password" class="form-control" name="currentPassword" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">Password Baru</label>
                        <input type="password" class="form-control" name="newPassword" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">Konfirmasi Password Baru</label>
                        <input type="password" class="form-control" name="confirmPassword" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-primary" id="btnSavePassword">Simpan</button>
            </div>
        </div>
    </div>
</div>
<!--end::Change Password Modal-->

<script>
// Load and display current user info
async function loadCurrentUser() {
    try {
        const response = await fetch('/api/auth/me', {
            credentials: 'include'
        });
        
        if (!response.ok) {
            // Not authenticated, redirect to login
            if (response.status === 401) {
                window.location.href = '/auth/login';
                return;
            }
            throw new Error('Failed to get user info');
        }
        
        const data = await response.json();
        
        if (data.success && data.user) {
            const user = data.user;
            
            // Get initials from name
            const initials = user.name
                ? user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2)
                : '?';
            
            // Update avatar
            const avatarEl = document.getElementById('header-user-avatar');
            const menuAvatarEl = document.getElementById('header-menu-avatar');
            if (avatarEl) avatarEl.textContent = initials;
            if (menuAvatarEl) menuAvatarEl.textContent = initials;
            
            // Update name and email
            const nameEl = document.getElementById('header-menu-name');
            const emailEl = document.getElementById('header-menu-email');
            if (nameEl) nameEl.textContent = user.name || 'User';
            if (emailEl) emailEl.textContent = user.email || '';
            
            // Add role badge if admin
            if (user.role === 'adminwa' && nameEl) {
                const badge = document.createElement('span');
                badge.className = 'badge badge-light-success fw-bold fs-8 px-2 py-1 ms-2';
                badge.textContent = 'Admin';
                nameEl.appendChild(badge);
                
                // Show admin-only menu items
                document.querySelectorAll('.admin-only-header-menu').forEach(el => {
                    el.style.display = '';
                });
            }
            
            // Store user in localStorage for other components
            localStorage.setItem('wa_user', JSON.stringify(user));
        }
    } catch (error) {
        console.error('Error loading user info:', error);
    }
}

// Handle logout with localStorage cleanup
document.addEventListener('DOMContentLoaded', function() {
    // Load current user info
    loadCurrentUser();
    
    // Handle logout
    const logoutLink = document.getElementById('header-logout-link');
    if (logoutLink) {
        logoutLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                try {
                    // Clear localStorage first
                    localStorage.removeItem('wa_user');
                    
                    // Call logout API
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                } finally {
                    // Always redirect to login
                    window.location.href = '/auth/login';
                }
            }
        });
    }
    
    // Handle change password
    const btnSavePassword = document.getElementById('btnSavePassword');
    if (btnSavePassword) {
        btnSavePassword.addEventListener('click', async () => {
            const form = document.getElementById('changePasswordForm');
            const currentPassword = form.querySelector('[name="currentPassword"]').value;
            const newPassword = form.querySelector('[name="newPassword"]').value;
            const confirmPassword = form.querySelector('[name="confirmPassword"]').value;
            
            // Validate
            if (!currentPassword || !newPassword || !confirmPassword) {
                alert('Semua field wajib diisi');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Password baru minimal 6 karakter');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('Password baru tidak cocok');
                return;
            }
            
            try {
                btnSavePassword.disabled = true;
                btnSavePassword.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';
                
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        currentPassword,
                        newPassword,
                        confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Password berhasil diubah');
                    form.reset();
                    // Close modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('changePasswordModal'));
                    if (modal) modal.hide();
                } else {
                    alert(data.error || 'Gagal mengubah password');
                }
            } catch (error) {
                console.error('Change password error:', error);
                alert('Terjadi kesalahan saat mengubah password');
            } finally {
                btnSavePassword.disabled = false;
                btnSavePassword.innerHTML = 'Simpan';
            }
        });
    }
});
</script>
