<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Penugasan | WhatsApp Gateway</title>
    <link rel="shortcut icon" href="assets/media/logos/favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
    <link href="assets/plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/style.bundle.css" rel="stylesheet" type="text/css" />
    <style>
        .priority-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .priority-low { background: #e8f5e9; color: #4caf50; }
        .priority-medium { background: #fff3e0; color: #ff9800; }
        .priority-critical { background: #ffebee; color: #f44336; }
        .action-assigned { color: #4caf50; }
        .action-unassigned { color: #f44336; }
        .note-cell { max-width: 250px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
    </style>
</head>

<body id="kt_app_body" data-kt-app-layout="dark-sidebar" data-kt-app-header-fixed="true" data-kt-app-sidebar-enabled="true" data-kt-app-sidebar-fixed="true" data-kt-app-sidebar-hoverable="true" data-kt-app-sidebar-push-header="true" data-kt-app-sidebar-push-toolbar="true" data-kt-app-sidebar-push-footer="true" data-kt-app-toolbar-enabled="true" class="app-default">

    <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
        <div class="app-page flex-column flex-column-fluid" id="kt_app_page">

            <div id="header-container"></div>

            <div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
                <div id="sidebar-container"></div>

                <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
                    <div class="d-flex flex-column flex-column-fluid">

                        <div id="kt_app_toolbar" class="app-toolbar py-3 py-lg-6">
                            <div id="kt_app_toolbar_container" class="app-container container-xxl d-flex flex-stack">
                                <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
                                    <h1 class="page-heading d-flex text-dark fw-bold fs-3 flex-column justify-content-center my-0">
                                        Log Penugasan
                                    </h1>
                                    <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
                                        <li class="breadcrumb-item text-muted"><a href="index.html" class="text-muted text-hover-primary">Home</a></li>
                                        <li class="breadcrumb-item"><span class="bullet bg-gray-400 w-5px h-2px"></span></li>
                                        <li class="breadcrumb-item text-muted">Log Penugasan</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div id="kt_app_content" class="app-content flex-column-fluid">
                            <div id="kt_app_content_container" class="app-container container-xxl">

                                <!-- Filters -->
                                <div class="card mb-6">
                                    <div class="card-body py-5">
                                        <div class="row g-4 align-items-end">
                                            <div class="col-md-3">
                                                <label class="form-label fs-7 fw-semibold">Worker</label>
                                                <select class="form-select form-select-sm" id="filter-worker">
                                                    <option value="">Semua Worker</option>
                                                </select>
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label fs-7 fw-semibold">Prioritas</label>
                                                <select class="form-select form-select-sm" id="filter-priority">
                                                    <option value="">Semua</option>
                                                    <option value="low">Low</option>
                                                    <option value="medium">Medium</option>
                                                    <option value="critical">Critical</option>
                                                </select>
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label fs-7 fw-semibold">Dari Tanggal</label>
                                                <input type="date" class="form-control form-control-sm" id="filter-date-from">
                                            </div>
                                            <div class="col-md-2">
                                                <label class="form-label fs-7 fw-semibold">Sampai Tanggal</label>
                                                <input type="date" class="form-control form-control-sm" id="filter-date-to">
                                            </div>
                                            <div class="col-md-3 d-flex gap-2">
                                                <button class="btn btn-sm btn-primary" id="btn-filter"><i class="bi bi-funnel me-1"></i>Filter</button>
                                                <button class="btn btn-sm btn-light" id="btn-reset"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Table -->
                                <div class="card">
                                    <div class="card-header border-0 pt-6 pb-4">
                                        <h3 class="card-title fw-bold fs-4">Riwayat Penugasan</h3>
                                        <div class="card-toolbar">
                                            <span class="text-muted fs-7" id="total-label"></span>
                                        </div>
                                    </div>
                                    <div class="card-body pt-0">
                                        <div class="table-responsive">
                                            <table class="table table-row-bordered table-row-gray-200 align-middle gs-0 gy-3">
                                                <thead>
                                                    <tr class="fw-bold text-muted fs-7">
                                                        <th>Waktu</th>
                                                        <th>Worker</th>
                                                        <th>Session</th>
                                                        <th>Kontak</th>
                                                        <th>Prioritas</th>
                                                        <th>Catatan</th>
                                                        <th>Aksi</th>
                                                        <th>Oleh</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="log-table-body">
                                                    <tr><td colspan="8" class="text-center py-10 text-muted">Memuat data...</td></tr>
                                                </tbody>
                                            </table>
                                        </div>

                                        <!-- Pagination -->
                                        <div class="d-flex justify-content-between align-items-center mt-4" id="pagination-row" style="display:none!important;">
                                            <div class="text-muted fs-7" id="page-info"></div>
                                            <div class="d-flex gap-2">
                                                <button class="btn btn-sm btn-light" id="btn-prev" disabled><i class="bi bi-chevron-left"></i> Prev</button>
                                                <button class="btn btn-sm btn-light" id="btn-next" disabled>Next <i class="bi bi-chevron-right"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                    <div id="footer-container"></div>
                </div>

            </div>
        </div>
    </div>

    <script src="assets/plugins/global/plugins.bundle.js"></script>
    <script src="assets/js/scripts.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/header.js"></script>

    <script>
        let currentPage = 1;
        const limit = 25;

        function loadHTMLWithScripts(containerId, html) {
            const c = document.getElementById(containerId);
            c.innerHTML = html;
            c.querySelectorAll('script').forEach(old => {
                const s = document.createElement('script');
                if (old.src) s.src = old.src; else s.textContent = old.textContent;
                old.parentNode.replaceChild(s, old);
            });
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function formatDateTime(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            if (isNaN(d)) return iso;
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })
                + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function cleanPhone(jid) {
            return (jid || '').replace(/@s\.whatsapp\.net|@g\.us/g, '');
        }

        async function loadLogs() {
            const params = new URLSearchParams({ page: currentPage, limit });
            const workerId = document.getElementById('filter-worker').value;
            const priority = document.getElementById('filter-priority').value;
            const dateFrom = document.getElementById('filter-date-from').value;
            const dateTo = document.getElementById('filter-date-to').value;
            if (workerId) params.set('workerId', workerId);
            if (priority) params.set('priority', priority);
            if (dateFrom) params.set('dateFrom', dateFrom);
            if (dateTo) params.set('dateTo', dateTo);

            try {
                const r = await fetch('/api/assignment-logs?' + params.toString());
                const d = await r.json();
                if (!d.success) throw new Error(d.error);

                const logs = d.logs || [];
                const total = d.total || 0;
                const totalPages = Math.ceil(total / limit) || 1;

                document.getElementById('total-label').textContent = total + ' log ditemukan';
                document.getElementById('page-info').textContent = 'Halaman ' + currentPage + ' dari ' + totalPages;

                const pRow = document.getElementById('pagination-row');
                pRow.style.display = total > limit ? 'flex' : 'none';
                document.getElementById('btn-prev').disabled = currentPage <= 1;
                document.getElementById('btn-next').disabled = currentPage >= totalPages;

                const tbody = document.getElementById('log-table-body');
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-10 text-muted">Tidak ada log ditemukan</td></tr>';
                    return;
                }

                tbody.innerHTML = logs.map(l => {
                    const priorityClass = 'priority-' + (l.priority || 'low');
                    const priorityLabel = { low: 'Low', medium: 'Medium', critical: 'Critical' }[l.priority] || 'Low';
                    const actionClass = l.action === 'assigned' ? 'action-assigned' : 'action-unassigned';
                    const actionLabel = l.action === 'assigned' ? 'Ditugaskan' : 'Dihapus';
                    return `<tr>
                        <td class="fs-7">${esc(formatDateTime(l.created_at))}</td>
                        <td class="fw-semibold fs-7">${esc(l.worker_name || 'Worker #' + l.worker_id)}</td>
                        <td class="fs-7">${esc(l.session_id)}</td>
                        <td class="fs-7">${esc(cleanPhone(l.contact))}</td>
                        <td><span class="priority-badge ${priorityClass}">${priorityLabel}</span></td>
                        <td class="note-cell">${esc(l.notes || '-')}</td>
                        <td><span class="${actionClass} fw-semibold fs-7">${actionLabel}</span></td>
                        <td class="fs-7 text-muted">${esc(l.assigned_by_name || '-')}</td>
                    </tr>`;
                }).join('');

            } catch (e) {
                document.getElementById('log-table-body').innerHTML =
                    '<tr><td colspan="8" class="text-center py-10 text-danger">Error: ' + esc(e.message) + '</td></tr>';
            }
        }

        async function loadWorkers() {
            try {
                const r = await fetch('/api/workers');
                const d = await r.json();
                const sel = document.getElementById('filter-worker');
                (d.workers || []).forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w.id;
                    opt.textContent = w.name;
                    sel.appendChild(opt);
                });
            } catch {}
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Load sidebar & header
            try {
                const [hdr, sb, ft] = await Promise.all([
                    fetch('/components/header.html').then(r => r.text()),
                    fetch('/components/sidebar.html').then(r => r.text()),
                    fetch('/components/footer.html').then(r => r.text())
                ]);
                loadHTMLWithScripts('header-container', hdr);
                loadHTMLWithScripts('sidebar-container', sb);
                loadHTMLWithScripts('footer-container', ft);
            } catch {}

            await loadWorkers();
            await loadLogs();

            document.getElementById('btn-filter').addEventListener('click', () => { currentPage = 1; loadLogs(); });
            document.getElementById('btn-reset').addEventListener('click', () => {
                document.getElementById('filter-worker').value = '';
                document.getElementById('filter-priority').value = '';
                document.getElementById('filter-date-from').value = '';
                document.getElementById('filter-date-to').value = '';
                currentPage = 1;
                loadLogs();
            });
            document.getElementById('btn-prev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; loadLogs(); } });
            document.getElementById('btn-next').addEventListener('click', () => { currentPage++; loadLogs(); });
        });
    </script>
</body>
</html>
