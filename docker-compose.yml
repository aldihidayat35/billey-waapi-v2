# ==========================================
# WhatsApp Multi-Session API - Docker Compose
# ==========================================

services:
  whatsapp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persist database
      - ./data:/app/data
      # Persist WhatsApp sessions
      - ./baileys_auth_info:/app/baileys_auth_info
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TZ=Asia/Jakarta
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  whatsapp-network:
    driver: bridge
