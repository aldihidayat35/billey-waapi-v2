# ==========================================
# WhatsApp Multi-Session API - Docker Compose
# ==========================================

services:
  whatsapp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-api
    restart: unless-stopped
    ports:
      - "8010:8080"
    volumes:
      # Persist database + media files
      - ./data:/app/data
      # Persist ALL WhatsApp sessions (centralized directory)
      - ./sessions:/app/sessions
      # Persist uploads (logo, favicon, etc.)
      - ./uploads:/app/public/uploads
      # Persist application logs
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TZ=Asia/Jakarta
      - SESSION_DIR=/app/sessions
    networks:
      whatsapp-network:
        ipv4_address: 172.29.1.10
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 1024M

networks:
  whatsapp-network:
    driver: bridge
    internal: false  
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    ipam:
      driver: default
      config:
        - subnet: 172.29.1.0/24
          gateway: 172.29.1.1
